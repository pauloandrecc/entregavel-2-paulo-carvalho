[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anotador-imagens"
version = "0.1.0"
description = "Desenha bounding boxes de um CSV sobre imagens usando OpenCV."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/anotador"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anotador-imagens"
version = "0.1.0"
description = "Desenha bounding boxes de um CSV sobre imagens usando OpenCV."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "poethepoet>=0.29",
]

[tool.hatch.build.targets.wheel]
packages = ["src/anotador"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=anotador --cov-report=term-missing"

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.poe.tasks]
lint = "ruff check ."
fmt-check = "ruff format --check ."
test = "env -u PYTHONPATH python -m pytest"
cov = "env -u PYTHONPATH python -m pytest --cov=anotador --cov-report=term-missing"
check = ["lint", "fmt-check", "test"]
run = "python -m anotador"